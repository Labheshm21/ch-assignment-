x-app-environment: &app-environment
  APP_ENV: ${APP_ENV}
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  FRONTEND_URL: ${FRONTEND_URL}
  BACKEND_URL: ${BACKEND_URL}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY}
  NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
  NVIDIA_MODEL: ${NVIDIA_MODEL}
  AUTOMATION_API_KEY: ${AUTOMATION_API_KEY}
  AUTOMATION_WORKSPACE_ID: ${AUTOMATION_WORKSPACE_ID}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS}
  WORKER_LOCK_TIMEOUT_MINUTES: ${WORKER_LOCK_TIMEOUT_MINUTES}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+psycopg://chronos:${POSTGRES_PASSWORD}@db:5432/chronos
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+psycopg://chronos:${POSTGRES_PASSWORD}@db:5432/chronos
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+psycopg://chronos:${POSTGRES_PASSWORD}@db:5432/chronos
    command: python -m app.worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  n8n:
    image: n8nio/n8n:2.48.7
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      RELAY_API_URL: http://api:8000
      RELAY_AUTOMATION_WORKSPACE_ID: ${AUTOMATION_WORKSPACE_ID}
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/files:ro
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api
      - n8n

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  n8n_data:
